<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AM SRI Pet Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(23, 23, 23, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 3rem;
            padding: 4rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 60px var(--red-glow-soft);
            animation: slideInUp 0.8s ease-out;
        }

        .auth-card:hover {
            border-color: rgba(220, 38, 38, 0.6);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6), 0 0 80px var(--red-glow);
            transition: all 0.5s ease;
        }

        .logo-auth {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 2rem;
            border: 4px solid var(--red-primary);
            box-shadow: 0 0 30px var(--red-glow);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .auth-title {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #ffffff, var(--red-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--gray-light);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        .form-label {
            color: var(--white-soft);
            font-weight: 600;
            margin-bottom: 0.8rem;
            display: block;
            font-size: 1rem;
        }

        .form-input {
            width: 100%;
            padding: 1.2rem 1.5rem 1.2rem 4rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--charcoal-light);
            border-radius: 1.5rem;
            color: var(--white-soft);
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 25px var(--red-glow-soft);
            background: rgba(0, 0, 0, 0.7);
        }

        .form-icon {
            position: absolute;
            left: 1.5rem;
            top: 63%;
            transform: translateY(-50%);
            color: var(--red-primary);
            font-size: 1.4rem;
        }

        .password-toggle {
            position: absolute;
            right: 1.5rem;
            top: 63%;
            transform: translateY(-50%);
            color: var(--gray-light);
            cursor: pointer;
            font-size: 1.4rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--red-primary);
        }

        .auth-btn {
            width: 100%;
            padding: 1.3rem;
            background: linear-gradient(135deg, var(--red-primary), var(--red-secondary));
            border: none;
            border-radius: 1.5rem;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 1rem;
            box-shadow: 0 10px 30px var(--red-glow);
        }

        .auth-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px var(--red-glow-strong);
            background: linear-gradient(135deg, var(--red-accent), var(--red-primary));
        }

        .auth-switch {
            text-align: center;
            margin-top: 2.5rem;
            color: var(--gray-light);
            font-size: 1.05rem;
        }

        .auth-switch a {
            color: var(--red-primary);
            font-weight: 700;
            text-decoration: none;
            margin-left: 0.5rem;
            transition: all 0.3s ease;
        }

        .auth-switch a:hover {
            color: var(--red-bright);
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2.5rem 0;
            color: var(--gray-muted);
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--charcoal-light);
        }

        .divider span {
            padding: 0 1.5rem;
        }

        .floating-paw {
            position: absolute;
            font-size: 4rem;
            color: var(--red-glow);
            opacity: 0.3;
            animation: floatY 6s ease-in-out infinite;
            z-index: 0;
        }

        .paw-1 {
            top: 15%;
            left: 10%;
            animation-delay: 0s;
        }

        .paw-2 {
            bottom: 20%;
            right: 12%;
            animation-delay: -3s;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--red-primary);
            color: var(--red-bright);
            padding: 1rem;
            border-radius: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 1rem;
            border-radius: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: none;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .remember-me input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--red-primary);
        }

        .remember-me label {
            color: var(--gray-light);
            font-size: 0.95rem;
            margin: 0;
        }

        @media (max-width: 576px) {
            .auth-card {
                margin: 1.5rem;
                padding: 2.5rem 2rem;
            }
            .auth-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>
    
    <i class="bi bi-paw floating-paw paw-1"></i>
    <i class="bi bi-paw floating-paw paw-2"></i>

    <div class="auth-container">
        <div class="auth-card">
            <img src="images/logo.jpeg" alt="AM SRI Pet Shop" class="logo-auth">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your account to continue shopping</p>
            
            <div id="errorMessage" class="error-message">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span id="errorText">Invalid email or password</span>
            </div>
            
            <div id="successMessage" class="success-message">
                <i class="bi bi-check-circle me-2"></i>
                <span id="successText">Login successful! Redirecting...</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <i class="bi bi-envelope-fill form-icon"></i>
                    <input type="email" class="form-input" id="loginEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <i class="bi bi-lock-fill form-icon"></i>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required>
                    <i class="bi bi-eye-fill password-toggle" id="togglePassword" onclick="togglePassword()"></i>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        // Password toggle functionality
        function togglePassword() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'bi bi-eye-slash-fill password-toggle';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'bi bi-eye-fill password-toggle';
            }
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Hide any previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Get registered users from localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('petshop_users') || '[]');
            const user = registeredUsers.find(u => u.email === email && u.password === password);

            if (user) {
                // Backfill customerId for existing users (migration)
                if (!user.customerId) {
                    user.customerId = 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    const registeredUsers = JSON.parse(localStorage.getItem('petshop_users') || '[]');
                    const idx = registeredUsers.findIndex(u => u.email === user.email);
                    if (idx !== -1) {
                        registeredUsers[idx] = user;
                        localStorage.setItem('petshop_users', JSON.stringify(registeredUsers));
                    }
                }
                
                // Store current user session
                localStorage.setItem('petshop_currentUser', JSON.stringify(user));
                
                // Show success message
                successMessage.style.display = 'block';
                
                // Redirect based on admin email or return URL
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect');
                setTimeout(() => {
                    if (email === 'devdharrshans.23csd@kongu.edu') {
                        window.location.href = '/admin.html';
                    } else if (redirect === 'checkout') {
                        window.location.href = '/checkout.html';
                    } else if (redirect === 'myorders') {
                        window.location.href = '/my-orders.html';
                    } else {
                        window.location.href = '/products.html';
                    }
                }, 1500);
            } else {
                // Show error message
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
